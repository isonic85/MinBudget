
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MinBudget</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">💰 MinBudget</div>
      <p>Din ekonomi. Din kontroll.</p>
    </header>

    <section class="card">
      <h2>Min månadsinkomst</h2>
      <label for="income">Inkomst efter skatt (kr)</label>
      <input id="income" type="number" min="0"
             placeholder="Exempel: 30000">
    </section>

    <section class="summary">
      <div class="stat">
        <span>Inkomst</span>
        <strong id="totalIncome">0 kr</strong>
      </div>
      <div class="stat">
        <span>Kostnader</span>
        <strong id="totalExpenses">0 kr</strong>
      </div>
      <div class="stat highlight">
        <span>Kvar efter kostnader</span>
        <strong id="remaining">0 kr</strong>
      </div>
    </section>

    <section class="card">
      <h2>Min 50/30/20-budget</h2>
      <p class="muted">Din plan jämfört med dina utgifter</p>
      <div id="categories"></div>
    </section>

    <section class="card">
      <h2>Lägg till en post</h2>
      <form id="expenseForm">
        <label for="expenseName">Namn</label>
        <input id="expenseName" required
               placeholder="T.ex. Bolån, mat eller sparande">

        <label for="expenseAmount">Belopp per månad</label>
        <input id="expenseAmount" type="number"
               min="0.01" step="0.01" required
               placeholder="Belopp i kronor">

        <label for="expenseCategory">Budgetkategori</label>
        <select id="expenseCategory">
          <option value="behov">50 % – Behov</option>
          <option value="onskemal">30 % – Önskemål</option>
          <option value="framtid">20 % – Framtid</option>
        </select>

        <label for="expenseType">Typ av post</label>
        <select id="expenseType">
          <option value="fast">Fast kostnad</option>
          <option value="rorlig">Rörlig kostnad</option>
          <option value="lan">Lån</option>
          <option value="sparande">Sparande</option>
        </select>

        <button type="submit">+ Lägg till</button>
      </form>
    </section>

    <section class="card">
      <h2>Mina registrerade poster</h2>
      <div id="expenseList"></div>
    </section>

    <footer>MinBudget • Personlig budgetöversikt</footer>
  </main>
</body>
</html>
