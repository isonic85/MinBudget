
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#17272b" />
  <title>MinBudget – Din ekonomi, enkelt</title>
  <meta
    name="description"
    content="Se direkt vad du har att leva på per dag fram till nästa lön."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="top">
      <button
        class="icon-btn"
        id="prev"
        aria-label="Föregående period"
      >‹</button>

      <div class="title">
        <h1 id="periodName"></h1>
        <p id="periodDates" class="muted small"></p>
      </div>

      <div class="row">
        <button
          class="icon-btn"
          id="next"
          aria-label="Nästa period"
        >›</button>

        <button
          class="icon-btn"
          id="openSettings"
          aria-label="Inställningar"
        >⚙</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="tabs" aria-label="Huvudmeny">
      <button data-tab="oversikt" class="tab active">
        <span class="tab-ico">⌂</span>
        Översikt
      </button>

      <button data-tab="rakningar" class="tab">
        <span class="tab-ico">≡</span>
        Räkningar
      </button>

      <button data-tab="extra" class="tab">
        <span class="tab-ico">◎</span>
        Extra
      </button>

      <div class="center">
        <button
          id="addBtn"
          class="fab"
          aria-label="Lägg till"
        >+</button>
      </div>
    </nav>
  </div>

  <dialog id="sheet" class="sheet">
    <div id="sheetBody"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
